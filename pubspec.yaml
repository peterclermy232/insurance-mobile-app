name: insurance_mobile
description: Crop Insurance Field - offline-first app for crop-insurance field officers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Network
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Location & camera
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
